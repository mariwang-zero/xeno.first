<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="제품명과 고장 내용을 입력하면 수리 항목과 가격을 즉시 찾아주는 접수 담당자용 챗봇 데모">
<meta name="color-scheme" content="light dark">
<title>수리 접수 도우미</title>
<style>
  :root{
    --bg:#EEF0F3;
    --surface:#FFFFFF;
    --surface-2:#F6F7F9;
    --ink:#1A2233;
    --ink-soft:#4B5565;
    --muted:#7B8695;
    --line:#E1E5EA;
    --accent:#DD6B12;
    --accent-ink:#FFFFFF;
    --accent-soft:#FCEADA;
    --free:#1E8E5A;
    --free-soft:#E3F5EC;
    --danger:#C0392B;
    --user-bubble:#1A2233;
    --user-bubble-ink:#F3F4F6;
    --shadow:0 1px 2px rgba(20,24,32,.05), 0 10px 28px rgba(20,24,32,.08);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151B;
      --surface:#1B1F27;
      --surface-2:#20242D;
      --ink:#ECEEF2;
      --ink-soft:#C3C9D3;
      --muted:#8A93A3;
      --line:#2B303B;
      --accent:#F0913F;
      --accent-ink:#1A1006;
      --accent-soft:#3B2716;
      --free:#3FCB86;
      --free-soft:#153A28;
      --danger:#E8695D;
      --user-bubble:#F3F4F6;
      --user-bubble-ink:#14171C;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12151B;
    --surface:#1B1F27;
    --surface-2:#20242D;
    --ink:#ECEEF2;
    --ink-soft:#C3C9D3;
    --muted:#8A93A3;
    --line:#2B303B;
    --accent:#F0913F;
    --accent-ink:#1A1006;
    --accent-soft:#3B2716;
    --free:#3FCB86;
    --free-soft:#153A28;
    --danger:#E8695D;
    --user-bubble:#F3F4F6;
    --user-bubble-ink:#14171C;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.45);
  }

  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;600;700;800&display=swap');

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Gothic A1', -apple-system, 'Malgun Gothic', sans-serif;
    font-variant-numeric:tabular-nums;
  }
  .app{
    height:100%;
    min-height:100%;
    display:grid;
    grid-template-columns: 296px 1fr;
  }
  .app[hidden]{ display:none; }

  /* ---------- Lock screen ---------- */
  .lock-screen{
    position:fixed; inset:0; z-index:100;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .lock-screen[hidden]{ display:none; }
  .lock-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:34px 28px 28px;
    width:min(340px,100%);
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .lock-title{ font-family:'Black Han Sans','Gothic A1',sans-serif; font-size:18px; margin-top:12px; }
  .lock-sub{ font-size:12.5px; color:var(--muted); margin-top:5px; margin-bottom:18px; line-height:1.5; }
  .lock-form{ width:100%; display:flex; flex-direction:column; gap:10px; }
  .lock-form input{
    width:100%; border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    border-radius:10px; padding:11px 13px; font-size:14px; font-family:inherit; text-align:center;
  }
  .lock-form input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .lock-form button{
    all:unset; cursor:pointer; text-align:center; box-sizing:border-box;
    background:var(--accent); color:var(--accent-ink); font-weight:800;
    padding:11px; border-radius:10px; font-size:14px;
  }
  .lock-error{ color:var(--danger); font-size:12.5px; margin-top:10px; }
  .lock-error[hidden]{ display:none; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .lock-card.shake{ animation:shake .28s ease; }
  @media (prefers-reduced-motion: reduce){ .lock-card.shake{ animation:none; } }
  @media (max-width: 780px){
    .app{ grid-template-columns: 1fr; grid-template-rows:auto 1fr; }
    .sidebar{ order:1; }
    .chatcol{ order:2; }
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--line);
    padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
    display:flex;
    flex-direction:column;
    gap:18px;
    overflow-y:auto;
  }
  @media (max-width: 780px){
    .sidebar{ border-right:none; border-bottom:1px solid var(--line); max-height:44vh; }
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand-badge{
    width:40px; height:40px; border-radius:11px;
    background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    flex:none;
  }
  .brand-name{
    font-family:'Black Han Sans', 'Gothic A1', sans-serif;
    font-size:19px; letter-spacing:.2px; line-height:1.15;
  }
  .brand-sub{ font-size:12px; color:var(--muted); margin-top:2px; }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat-tile{
    background:var(--surface-2); border:1px solid var(--line);
    border-radius:var(--radius); padding:12px 12px 11px;
  }
  .stat-num{ font-size:26px; font-weight:800; line-height:1.1; }
  .stat-num small{ font-size:13px; font-weight:700; color:var(--muted); }
  .stat-label{ font-size:11.5px; color:var(--muted); margin-top:4px; }

  .section-title{
    font-size:11.5px; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em;
    margin:2px 0 -4px;
  }

  .chip-list{ display:flex; flex-direction:column; gap:7px; }
  .chip{
    text-align:left;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:9px 11px;
    border-radius:10px;
    font-size:12.5px;
    font-family:inherit;
    cursor:pointer;
    line-height:1.4;
  }
  .chip:hover{ border-color:var(--accent); color:var(--ink); }
  .chip b{ color:var(--ink); font-weight:700; }

  .legend{ display:flex; flex-direction:column; gap:8px; font-size:12.5px; color:var(--ink-soft); }
  .legend-row{ display:flex; align-items:center; gap:8px; }
  .dot{ width:9px; height:9px; border-radius:50%; flex:none; }

  .sidebar-footer{
    margin-top:auto; padding-top:12px; border-top:1px solid var(--line);
    font-size:11px; color:var(--muted); line-height:1.6;
  }
  .sidebar-footer button{
    all:unset; cursor:pointer; color:var(--accent); font-weight:700; font-size:11.5px;
  }

  /* ---------- Chat column ---------- */
  .chatcol{ display:flex; flex-direction:column; min-height:0; height:100%; }
  .chat-header{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
    padding:14px 20px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    background:var(--surface); border-bottom:1px solid var(--line);
  }
  .chat-header-title{ font-weight:800; font-size:15px; }
  .chat-header-date{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .ghost-btn{
    all:unset; cursor:pointer;
    font-size:12.5px; font-weight:700; color:var(--ink-soft);
    background:var(--surface-2); border:1px solid var(--line);
    padding:8px 12px; border-radius:9px; white-space:nowrap;
  }
  .ghost-btn:hover{ border-color:var(--accent); color:var(--ink); }

  .messages{
    flex:1; overflow-y:auto; padding:18px 20px 10px;
    display:flex; flex-direction:column; gap:14px;
  }
  .row{ display:flex; gap:10px; max-width:100%; }
  .row.user{ justify-content:flex-end; }
  .avatar{
    width:30px; height:30px; border-radius:9px; flex:none;
    background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    margin-top:2px;
  }
  .bubble-wrap{ display:flex; flex-direction:column; max-width:min(520px, 82%); }
  .row.user .bubble-wrap{ align-items:flex-end; }
  .bubble{
    background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow);
    padding:12px 14px; border-radius:var(--radius); border-top-left-radius:4px;
    font-size:14px; line-height:1.55; color:var(--ink);
  }
  .row.user .bubble{
    background:var(--user-bubble); color:var(--user-bubble-ink); border:none;
    border-top-left-radius:var(--radius); border-top-right-radius:4px;
  }
  .bubble p{ margin:0 0 6px; }
  .bubble p:last-child{ margin-bottom:0; }
  .msg-time{ font-size:10.5px; color:var(--muted); margin-top:4px; padding:0 2px; }

  .result-card{
    border:1px solid var(--line); border-radius:11px; overflow:hidden; margin-top:2px;
  }
  .result-card .head{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px; background:var(--surface-2); font-weight:700; font-size:12.5px;
  }
  .tag{ font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; }
  .tag.paid{ background:var(--accent-soft); color:var(--accent); }
  .tag.free{ background:var(--free-soft); color:var(--free); }
  .kv{ padding:10px 12px; display:flex; flex-direction:column; gap:6px; }
  .kv-row{ display:flex; gap:10px; font-size:13.5px; }
  .kv-row .k{ width:64px; flex:none; color:var(--muted); }
  .kv-row .v{ font-weight:600; }
  .price{ font-family:'Gothic A1', sans-serif; font-weight:800; color:var(--accent); font-size:16px; }
  .row.user .price{ color:inherit; }

  .choice-list{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .choice-btn{
    all:unset; cursor:pointer; display:flex; align-items:center; gap:10px;
    padding:10px 11px; border:1px solid var(--line); border-radius:10px;
    background:var(--surface-2); font-size:13px; color:var(--ink);
  }
  .choice-btn:hover{ border-color:var(--accent); }
  .choice-num{
    width:20px; height:20px; border-radius:6px; background:var(--accent); color:var(--accent-ink);
    font-size:11.5px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .choice-text{ flex:1; }
  .choice-price{ font-weight:800; color:var(--accent); font-size:12.5px; white-space:nowrap; }
  .choice-badge{ font-size:10.5px; font-weight:800; color:var(--free); white-space:nowrap; }

  .typing{ display:inline-flex; gap:4px; padding:4px 2px; }
  .typing span{
    width:6px; height:6px; border-radius:50%; background:var(--muted);
    animation:blink 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }

  .composer{
    padding:12px 16px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--surface); border-top:1px solid var(--line);
    display:flex; gap:9px; align-items:flex-end;
  }
  .composer textarea{
    flex:1; resize:none; border:1px solid var(--line); background:var(--surface-2);
    color:var(--ink); border-radius:12px; padding:11px 13px; font-size:14px;
    font-family:inherit; line-height:1.4; max-height:110px;
  }
  .composer textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .send-btn{
    all:unset; cursor:pointer; flex:none;
    width:44px; height:44px; border-radius:12px;
    background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center;
  }
  .send-btn:active{ transform:scale(.96); }
  .send-btn[disabled]{ opacity:.4; cursor:default; }

  /* ---------- Modal (전체 단가표) ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,12,16,.45);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal-backdrop[hidden]{ display:none; }
  .modal{
    background:var(--surface); border-radius:16px; width:min(720px,100%);
    max-height:min(640px,86vh); display:flex; flex-direction:column; overflow:hidden;
    box-shadow:var(--shadow);
  }
  .modal-head{
    padding:16px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .modal-head h2{ font-size:15px; margin:0; font-family:'Black Han Sans'; letter-spacing:.2px; }
  .modal-close{ all:unset; cursor:pointer; color:var(--muted); padding:4px; }
  .modal-search{ padding:12px 18px 0; }
  .modal-search input{
    width:100%; border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    border-radius:10px; padding:10px 12px; font-size:13.5px; font-family:inherit;
  }
  .table-wrap{ overflow:auto; padding:12px 18px 18px; }
  table{ width:100%; border-collapse:collapse; font-size:12.8px; }
  thead th{
    text-align:left; color:var(--muted); font-weight:700; font-size:11.5px;
    padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap;
    position:sticky; top:0; background:var(--surface);
  }
  tbody td{ padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:last-child td{ border-bottom:none; }
  td.price-cell{ text-align:right; font-weight:700; white-space:nowrap; }

  @media (prefers-reduced-motion: reduce){
    .typing span{ animation:none; opacity:1; }
  }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-card" id="lockCard">
    <div class="brand-badge" aria-hidden="true">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M14.7 6.3a4 4 0 0 1-5.1 5.1L4 17l3 3 5.6-5.6a4 4 0 0 1 5.1-5.1l-2.6 2.6-2-2 2.6-2.6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    </div>
    <div class="lock-title">수리 접수 도우미</div>
    <div class="lock-sub">개인용 페이지입니다.<br>비밀번호를 입력해 주세요.</div>
    <form class="lock-form" id="pwForm">
      <input type="password" id="pwInput" placeholder="비밀번호" autocomplete="off" autofocus>
      <button type="submit">입장하기</button>
    </form>
    <div class="lock-error" id="pwError" hidden>비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<div class="app" id="appRoot" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-badge" aria-hidden="true">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M14.7 6.3a4 4 0 0 1-5.1 5.1L4 17l3 3 5.6-5.6a4 4 0 0 1 5.1-5.1l-2.6 2.6-2-2 2.6-2.6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div class="brand-name">수리 접수 도우미</div>
        <div class="brand-sub">제품 + 고장 내용 → 항목·가격 바로 확인</div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-tile">
        <div class="stat-num" id="statCount">0<small>건</small></div>
        <div class="stat-label">오늘 처리 건수</div>
      </div>
      <div class="stat-tile">
        <div class="stat-num" id="statSaved">0<small>분</small></div>
        <div class="stat-label">예상 절감 시간</div>
      </div>
    </div>

    <div>
      <div class="section-title">빠른 테스트</div>
      <div class="chip-list" id="chipList" style="margin-top:8px;"></div>
    </div>

    <div>
      <div class="section-title">표시 구분</div>
      <div class="legend" style="margin-top:8px;">
        <div class="legend-row"><span class="dot" style="background:var(--accent)"></span>유료 수리 — 가격 안내</div>
        <div class="legend-row"><span class="dot" style="background:var(--free)"></span>무료(점검·보증) — 별도 확인 필요</div>
      </div>
    </div>

    <div class="sidebar-footer">
      건당 5~10분 걸리던 조회를 몇 초로 줄여줍니다.<br>
      데이터: 수리단가표_데모.xlsx · 총 <span id="rowCount">0</span>개 항목<br>
      <button id="openTableFooter" type="button">전체 단가표 보기 →</button>
    </div>
  </aside>

  <section class="chatcol">
    <header class="chat-header">
      <div>
        <div class="chat-header-title">오늘의 수리 접수</div>
        <div class="chat-header-date" id="todayLabel"></div>
      </div>
      <button class="ghost-btn" id="openTableTop" type="button">전체 단가표</button>
    </header>

    <div class="messages" id="messages"></div>

    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="예: 세탁기 배수 안 됨, 배수 호스 교체" autofocus></textarea>
      <button class="send-btn" id="sendBtn" type="submit" aria-label="전송">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 12 20 4l-6 16-3-7-7-1Z" fill="currentColor"/></svg>
      </button>
    </form>
  </section>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2>전체 수리단가표</h2>
      <button class="modal-close" id="modalClose" aria-label="닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-search">
      <input type="text" id="tableFilter" placeholder="제품명, 고장 종류, 수리 항목으로 검색…">
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>제품명</th><th>고장 종류</th><th>수리 항목</th><th>가격</th><th>구분</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- 비밀번호 잠금 ----------
  // 비밀번호 누출구간 아몰랑
  var SITE_PASSWORD = "12345";
  var UNLOCK_KEY = "repairBotUnlocked";

  var lockScreen = document.getElementById("lockScreen");
  var appRoot = document.getElementById("appRoot");
  var pwForm = document.getElementById("pwForm");
  var pwInput = document.getElementById("pwInput");
  var pwError = document.getElementById("pwError");
  var lockCard = document.getElementById("lockCard");

  function unlockApp(){
    try{ sessionStorage.setItem(UNLOCK_KEY, "1"); }catch(e){}
    lockScreen.hidden = true;
    appRoot.hidden = false;
    var firstInput = document.getElementById("input");
    if(firstInput) firstInput.focus();
  }

  var alreadyUnlocked = false;
  try{ alreadyUnlocked = sessionStorage.getItem(UNLOCK_KEY) === "1"; }catch(e){}

  if(alreadyUnlocked){
    unlockApp();
  } else {
    pwForm.addEventListener("submit", function(e){
      e.preventDefault();
      if(pwInput.value === SITE_PASSWORD){
        unlockApp();
      } else {
        pwError.hidden = false;
        pwInput.value = "";
        pwInput.focus();
        lockCard.classList.remove("shake");
        void lockCard.offsetWidth; 
        lockCard.classList.add("shake");
      }
    });
  }

  // ---------- 데이터 (수리단가표_데모.xlsx 와 동일한 내용) ----------
  var DATA = [
    ["냉장고","문이 잘 안 닫힘","냉장고 문짝 교체",150000,"유료"],
    ["냉장고","문 손잡이 파손","냉장고 문 손잡이 교체",30000,"유료"],
    ["냉장고","문틈으로 냉기 샘","냉장고 문 고무 패킹 교체",25000,"유료"],
    ["냉장고","냉장이 잘 안 됨","냉장고 컴프레서(압축기) 교체",280000,"유료"],
    ["냉장고","소음이 심하게 남","냉장고 팬 모터 교체",60000,"유료"],
    ["냉장고","성에가 많이 낌","냉장고 제상 히터 교체",70000,"유료"],
    ["냉장고","정기 점검 요청","냉장고 정기 점검",0,"무료(점검)"],
    ["냉장고","보증기간 내 고장","냉장고 보증기간 내 무상 교체",0,"무료(보증)"],
    ["세탁기","물이 안 빠짐","세탁기 배수 호스 교체",45000,"유료"],
    ["세탁기","탈수가 안 됨","세탁기 탈수 모터 교체",120000,"유료"],
    ["세탁기","문이 안 열림","세탁기 도어락 교체",55000,"유료"],
    ["세탁기","운전 중 소음 발생","세탁기 베어링 교체",90000,"유료"],
    ["세탁기","운전 중 심하게 흔들림","세탁기 수평 조절 및 완충 패드 교체",40000,"유료"],
    ["세탁기","전원이 안 켜짐","세탁기 메인 기판(PCB) 교체",180000,"유료"],
    ["세탁기","정기 점검 요청","세탁기 정기 점검",0,"무료(점검)"],
    ["에어컨","찬바람이 안 나옴","에어컨 냉매 충전",80000,"유료"],
    ["에어컨","실외기 소음이 심함","에어컨 실외기 팬 교체",95000,"유료"],
    ["에어컨","물이 새어 나옴","에어컨 배수 호스 교체",35000,"유료"],
    ["에어컨","냄새가 심하게 남","에어컨 필터 및 내부 세척",60000,"유료"],
    ["에어컨","필터 청소 요청","에어컨 필터 청소 점검",0,"무료(점검)"],
    ["에어컨","리모컨 인식이 안 됨","에어컨 리모컨 수신부 교체",25000,"유료"],
    ["건조기","건조가 잘 안 됨","건조기 히터 교체",130000,"유료"],
    ["건조기","먼지가 잘 안 걸러짐","건조기 콘덴서 청소",40000,"유료"],
    ["건조기","전원이 안 켜짐","건조기 메인 기판(PCB) 교체",170000,"유료"],
    ["TV","화면에 줄이 생김","TV 패널 교체",350000,"유료"],
    ["TV","소리가 안 나옴","TV 스피커 모듈 교체",50000,"유료"],
    ["TV","전원이 안 켜짐","TV 전원보드 교체",90000,"유료"],
    ["TV","화면이 깜빡거림","TV 백라이트 교체",120000,"유료"],
    ["정수기","물맛이 이상함","정수기 필터 교체",20000,"유료"],
    ["정수기","온수가 안 나옴","정수기 온수 히터 교체",65000,"유료"],
    ["정수기","정기 필터 점검","정수기 정기 점검",0,"무료(점검)"],
    ["청소기","흡입력이 약함","청소기 모터 교체",85000,"유료"],
    ["청소기","배터리가 금방 닳음","청소기 배터리 교체",55000,"유료"],
    ["청소기","보증기간 내 배터리 불량","청소기 배터리 무상 교체",0,"무료(보증)"]
  ].map(function(r){
    return {product:r[0], issue:r[1], item:r[2], price:r[3], category:r[4], isFree:r[4]!=="유료"};
  });

  var PRODUCTS = Array.from(new Set(DATA.map(function(r){return r.product;})));
  var CLOSING_WORDS = ["끝","그만","종료","다했어요","다 했어요","오늘다했어요","오늘 다 했어요","수고했어요","마감"];
  var MINUTES_PER_TICKET = 7;

  // ---------- 매칭 로직 ----------
  function normalize(s){ return String(s).replace(/\s+/g,"").toLowerCase(); }
  function tokenize(s){
    return String(s).split(/[\s,\/·\-–—]+/).map(function(t){return t.trim();}).filter(function(t){return t.length>0;});
  }
  function isClosingMessage(raw){
    var n = normalize(raw);
    return CLOSING_WORDS.some(function(w){ return n === normalize(w); });
  }
  function isPureNumber(raw){
    var m = String(raw).trim().match(/^(\d{1,2})\s*번?\.?$/);
    return m ? parseInt(m[1],10) : null;
  }
  function findMatches(raw){
    var norm = normalize(raw);
    var tokens = tokenize(raw);
    var mentionedProducts = PRODUCTS.filter(function(p){ return norm.indexOf(normalize(p)) !== -1; });
    var pool = mentionedProducts.length
      ? DATA.filter(function(r){ return mentionedProducts.indexOf(r.product) !== -1; })
      : DATA;

    var scored = pool.map(function(row){
      var targetNorm = normalize(row.issue + " " + row.item);
      var score = mentionedProducts.indexOf(row.product) !== -1 ? 2 : 0;
      tokens.forEach(function(tok){
        var tn = normalize(tok);
        if(tn.length === 0) return;
        if(tn === normalize(row.product)) return; // 제품명 중복 가산 방지
        if(tn.length >= 2 && targetNorm.indexOf(tn) !== -1) score += 2;
        else if(tn.length === 1 && targetNorm.indexOf(tn) !== -1) score += 1;
      });
      return {row:row, score:score};
    }).filter(function(s){ return s.score > 0; });

    scored.sort(function(a,b){ return b.score - a.score; });
    return scored;
  }

  // ---------- 상태 ----------
  var state = { pending:null, count:0 };

  // ---------- DOM 준비 ----------
  var messagesEl = document.getElementById("messages");
  var chipListEl = document.getElementById("chipList");
  var statCountEl = document.getElementById("statCount");
  var statSavedEl = document.getElementById("statSaved");
  var rowCountEl = document.getElementById("rowCount");
  var todayLabelEl = document.getElementById("todayLabel");
  var composerForm = document.getElementById("composer");
  var inputEl = document.getElementById("input");

  rowCountEl.textContent = DATA.length;
  try{
    todayLabelEl.textContent = new Intl.DateTimeFormat('ko-KR', {year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());
  }catch(e){ todayLabelEl.textContent = ""; }

  function fmtPrice(n){
    return n.toLocaleString('ko-KR') + "원";
  }
  function fmtTime(){
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    var ap = h < 12 ? "오전" : "오후";
    var h12 = h % 12; if(h12 === 0) h12 = 12;
    return ap + " " + h12 + ":" + (m < 10 ? "0"+m : m);
  }
  function scrollToBottom(){
    messagesEl.scrollTop = messagesEl.scrollHeight + 200;
  }

  function botAvatar(){
    var d = document.createElement("div");
    d.className = "avatar";
    d.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M14.7 6.3a4 4 0 0 1-5.1 5.1L4 17l3 3 5.6-5.6a4 4 0 0 1 5.1-5.1l-2.6 2.6-2-2 2.6-2.6Z" fill="currentColor"/></svg>';
    return d;
  }

  function addRow(sender, buildBubble){
    var row = document.createElement("div");
    row.className = "row " + sender;
    if(sender === "bot") row.appendChild(botAvatar());
    var wrap = document.createElement("div");
    wrap.className = "bubble-wrap";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    buildBubble(bubble);
    wrap.appendChild(bubble);
    var time = document.createElement("div");
    time.className = "msg-time";
    time.textContent = fmtTime();
    wrap.appendChild(time);
    row.appendChild(wrap);
    messagesEl.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  function addUserText(text){
    addRow("user", function(bubble){
      var p = document.createElement("p");
      p.textContent = text;
      bubble.appendChild(p);
    });
  }

  function addBotParagraphs(lines){
    return addRow("bot", function(bubble){
      lines.forEach(function(line){
        var p = document.createElement("p");
        p.textContent = line;
        bubble.appendChild(p);
      });
    });
  }

  function addTyping(callback){
    var bubble = addRow("bot", function(b){
      b.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    });
    var row = bubble.closest(".row");
    setTimeout(function(){
      row.remove();
      callback();
    }, 380 + Math.random()*260);
  }

  function addResultCard(row){
    addRow("bot", function(bubble){
      var intro = document.createElement("p");
      intro.textContent = row.isFree ? "확인해봤어요." : "찾았습니다!";
      bubble.appendChild(intro);

      var card = document.createElement("div");
      card.className = "result-card";

      var head = document.createElement("div");
      head.className = "head";
      head.innerHTML = '<span>' + row.product + ' · ' + row.item + '</span>';
      var tag = document.createElement("span");
      tag.className = "tag " + (row.isFree ? "free" : "paid");
      tag.textContent = row.isFree ? row.category : "유료";
      head.appendChild(tag);
      card.appendChild(head);

      var kv = document.createElement("div");
      kv.className = "kv";
      kv.appendChild(kvRow("제품", row.product));
      kv.appendChild(kvRow("수리 내용", row.item));
      if(!row.isFree){
        var priceRow = kvRow("가격", "");
        var pspan = document.createElement("span");
        pspan.className = "price";
        pspan.textContent = fmtPrice(row.price);
        priceRow.querySelector(".v").appendChild(pspan);
        kv.appendChild(priceRow);
      }
      card.appendChild(kv);
      bubble.appendChild(card);

      if(row.isFree){
        var note = document.createElement("p");
        note.style.marginTop = "8px";
        note.style.color = "var(--muted)";
        note.style.fontSize = "12.5px";
        note.textContent = "이 항목은 일반 유료 수리가 아닌 점검 또는 무료 교체 항목으로 보입니다. 별도로 처리가 필요한 경우일 수 있으니 직접 확인해 주세요.";
        bubble.appendChild(note);
      }

      var ask = document.createElement("p");
      ask.style.marginTop = "8px";
      ask.textContent = "다음 수리 요청도 입력해 드릴까요?";
      bubble.appendChild(ask);
    });
  }

  function kvRow(k, v){
    var r = document.createElement("div");
    r.className = "kv-row";
    var kEl = document.createElement("div"); kEl.className = "k"; kEl.textContent = k;
    var vEl = document.createElement("div"); vEl.className = "v"; vEl.textContent = v;
    r.appendChild(kEl); r.appendChild(vEl);
    return r;
  }

  function addChoiceList(candidates){
    addRow("bot", function(bubble){
      var p = document.createElement("p");
      p.textContent = "비슷한 항목이 여러 개 있어요. 아래에서 맞는 항목을 골라 번호를 입력하거나 눌러 주세요.";
      bubble.appendChild(p);

      var list = document.createElement("div");
      list.className = "choice-list";
      candidates.forEach(function(c, idx){
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice-btn";
        var num = document.createElement("span");
        num.className = "choice-num";
        num.textContent = String(idx+1);
        var text = document.createElement("span");
        text.className = "choice-text";
        text.textContent = c.row.product + " · " + c.row.item;
        var right = document.createElement("span");
        if(c.row.isFree){
          right.className = "choice-badge";
          right.textContent = c.row.category;
        } else {
          right.className = "choice-price";
          right.textContent = fmtPrice(c.row.price);
        }
        btn.appendChild(num); btn.appendChild(text); btn.appendChild(right);
        btn.addEventListener("click", function(){
          resolveChoice(idx+1);
        });
        list.appendChild(btn);
      });
      bubble.appendChild(list);
    });
  }

  function addNotFound(){
    addBotParagraphs([
      "해당 항목을 찾을 수 없습니다. 엑셀 파일을 직접 확인해 주세요.",
      "다음 수리 요청이 있으면 입력해 주세요."
    ]);
  }

  function addClosing(){
    addBotParagraphs(["오늘 수리 요청 처리가 모두 끝났군요. 수고하셨습니다!"]);
  }

  function bumpStats(){
    state.count += 1;
    statCountEl.innerHTML = state.count + "<small>건</small>";
    statSavedEl.innerHTML = (state.count*MINUTES_PER_TICKET) + "<small>분</small>";
  }

  function resolveChoice(n){
    if(!state.pending) return;
    var idx = n-1;
    if(idx < 0 || idx >= state.pending.length){
      addBotParagraphs(["목록에 있는 번호로 다시 골라 주세요. (1~" + state.pending.length + ")"]);
      return;
    }
    var chosen = state.pending[idx].row;
    state.pending = null;
    addTyping(function(){
      addResultCard(chosen);
      bumpStats();
    });
  }

  function handleUserMessage(raw){
    var text = raw.trim();
    if(text.length === 0) return;
    addUserText(text);

    if(isClosingMessage(text)){
      state.pending = null;
      addTyping(addClosing);
      return;
    }

    var picked = isPureNumber(text);
    if(state.pending && picked !== null){
      resolveChoice(picked);
      return;
    }

    var matches = findMatches(text);
    if(matches.length === 0){
      state.pending = null;
      addTyping(addNotFound);
      return;
    }

    var top = matches[0].score;
    var tied = matches.filter(function(m){ return m.score === top; });

    if(tied.length === 1){
      state.pending = null;
      addTyping(function(){
        addResultCard(tied[0].row);
        bumpStats();
      });
    } else {
      state.pending = tied.slice(0, 6);
      addTyping(function(){
        addChoiceList(state.pending);
      });
    }
  }

  // ---------- 입력창 ----------
  composerForm.addEventListener("submit", function(e){
    e.preventDefault();
    var v = inputEl.value;
    inputEl.value = "";
    inputEl.style.height = "auto";
    handleUserMessage(v);
  });
  inputEl.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      composerForm.requestSubmit();
    }
  });
  inputEl.addEventListener("input", function(){
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + "px";
  });

  // ---------- 빠른 테스트 칩 ----------
  var CHIPS = [
    {label:"세탁기 배수 안 됨, 배수 호스 교체", tagText:"바로 찾기", value:"세탁기 배수 안 됨, 배수 호스 교체"},
    {label:"냉장고 문 문제", tagText:"여러 항목", value:"냉장고 문 문제"},
    {label:"냉장고 정기 점검", tagText:"무료 항목", value:"냉장고 정기 점검"},
    {label:"선풍기 날개 깨짐", tagText:"목록에 없음", value:"선풍기 날개 깨짐"}
  ];
  CHIPS.forEach(function(c){
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip";
    btn.innerHTML = '<b>' + c.tagText + '</b> · ' + c.label;
    btn.addEventListener("click", function(){
      handleUserMessage(c.value);
    });
    chipListEl.appendChild(btn);
  });

  // ---------- 전체 단가표 모달 ----------
  var modalBackdrop = document.getElementById("modalBackdrop");
  var tableBody = document.getElementById("tableBody");
  var tableFilter = document.getElementById("tableFilter");

  function renderTable(filterText){
    var norm = normalize(filterText || "");
    tableBody.innerHTML = "";
    DATA.forEach(function(row){
      if(norm && normalize(row.product+row.issue+row.item).indexOf(norm) === -1) return;
      var tr = document.createElement("tr");
      var priceText = row.isFree ? row.category : fmtPrice(row.price);
      tr.innerHTML =
        "<td>" + escapeHtml(row.product) + "</td>" +
        "<td>" + escapeHtml(row.issue) + "</td>" +
        "<td>" + escapeHtml(row.item) + "</td>" +
        "<td class='price-cell' style='color:" + (row.isFree ? "var(--free)" : "var(--accent)") + "'>" + escapeHtml(priceText) + "</td>" +
        "<td>" + escapeHtml(row.category) + "</td>";
      tableBody.appendChild(tr);
    });
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function openModal(){
    renderTable("");
    tableFilter.value = "";
    modalBackdrop.hidden = false;
    setTimeout(function(){ tableFilter.focus(); }, 50);
  }
  function closeModal(){ modalBackdrop.hidden = true; }
  document.getElementById("openTableTop").addEventListener("click", openModal);
  document.getElementById("openTableFooter").addEventListener("click", openModal);
  document.getElementById("modalClose").addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", function(e){ if(e.target === modalBackdrop) closeModal(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });
  tableFilter.addEventListener("input", function(){ renderTable(tableFilter.value); });

  // ---------- 시작 인사 ----------
  addBotParagraphs([
    "안녕하세요! 수리 접수 도우미예요.",
    "제품 이름과 고장 내용을 입력해 주시면 수리 항목과 가격을 바로 찾아 드릴게요.",
    "예) 세탁기 배수 안 됨, 배수 호스 교체"
  ]);
})();
</script>
