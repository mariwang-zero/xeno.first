특정 운영체제(OS)는 녹화 시작전(30분단위) 스냅샷 소리를 낸다.(사용자 알림, 프라이버시 보호)`],["","[그림]",`일시 정지 버튼 (왼쪽, 두 개의 세로 막대 모양): 이 버튼은 녹화가 진행 중일 때 누르면 녹화가 일시 정지된다. 즉, 현재까지 녹화한 영상은 저장되지만, 일시적으로 녹화를 멈추고 나중에 이어서 녹화를 할 수 있다. 일시 정지 상태에서 다시 누르면(빨간색 원 모양) 녹화가 재개된다.
정지 버튼 (오른쪽, 사각형 모양): 이 버튼은 녹화를 완전히 종료하는 버튼이다. 녹화를 종료한 후에는 새로운 파일로 저장되며, 다시 녹화를 시작할 때는 새로운 녹화 파일이 생성된다.`],["","[그림]","재생 파일에서 특정 구간을 선택해 새로운 파일로 저장시 사용 한다."],["","하이라이트 태그","녹화 상태에서 리모컨의 하이라이트 태그 버튼을 누르면 아래 그림과 같이 태그 표시가 재생 화면에 나타난다."],["영상 목록","영상 목록 버튼을 누르면 휴대기기에 저당된 영상 목록이 표시된다.",""]]},{id:"p13-b5",type:"p",text:"⚠ 주의(WARNING):"},{id:"p13-b6",type:"p",text:"뷰어의 일부 기능은 OS의 지원 여부에 따라 표시되지 않거나 동작 하지 않을 수 있다."}]},{no:14,blocks:[{id:"p14-b1",type:"h",text:"3. 설정 옵션 상세",cert:!1},{id:"p14-b2",type:"img",text:"그림"},{id:"p14-b3",type:"p",text:"1) Capture Resolution : 녹화 파일의 해상도 설정. UHD(4K,2160p), FHD(1080p) 또는 HD(720p)"},{id:"p14-b4",type:"p",text:"설정된 해상도는 화면 오른쪽 하단에 표시된다."},{id:"p14-b5",type:"img",text:"그림"},{id:"p14-b6",type:"p",text:"2) MIC Volume : 녹화 파일의 마이크 감도를 On/Off 조절한다."},{id:"p14-b7",type:"p",text:"3) Voice Language : 본체 알림 메시지의 언어를 선택한다."},{id:"p14-b8",type:"p",text:"(예) 메모리부족, 레코딩 스타트-스톱, 카메라 연결 확인 등"},{id:"p14-b9",type:"p",text:"4) Capture Folder : 녹화 파일 저장 위치를 선택 한다."},{id:"p14-b10",type:"p",text:"5) Image Control: 이미지 컬러를 수정 또는 자동으로 설정할 수 있다. (자동 권장)"},{id:"p14-b11",type:"p",text:"⚠ 주의(WARNING):"},{id:"p14-b12",type:"p",text:"노출(Exposure) 및 Backlight Compensation(백라이트 보상) 설정 시 주의: 노출 시간을 길게 하거나 백라이트 보상을 활성화하면 영상 품질은 향상되지만, 프레임 속도가 낮아질 수 있다."}]},{no:15,blocks:[{id:"p15-b1",type:"h",text:"4. 영상 녹화",cert:!1},{id:"p15-b2",type:"img",text:"녹화 버튼 / 스냅 촬영   버튼 / 일시정지 버튼 / (Pause frame) · 카메라 상태 LED · ① 전원 스위치"},{id:"p15-b3",type:"p",text:"LooksCAM LT조립체가 휴대기기의 USB-C 포트에 잘 연결 됐는지 점검 하고 전용 뷰어 앱을 실행 시켜 카메라 상태 LED가 정상(On)인지 확인 한다."},{id:"p15-b4",type:"p",text:"[REC] 녹화 버튼을 누르면 녹화를 시작한다."},{id:"p15-b5",type:"p",text:"녹화 도중 녹화 버튼을 다시 누르면 녹화를 중지한다."},{id:"p15-b6",type:"p",text:"MIC 설정은 상시 ON이며, 동영상 녹화 파일은 음성도 같이 저장된다."},{id:"p15-b7",type:"p",text:"(MIC Off는 뷰어 설정에서 MIC Volume 를 0%로 설정한다.)"},{id:"p15-b8",type:"h",text:"5. 영상 일시 정지와 스냅 촬영",cert:!1},{id:"p15-b9",type:"p",text:"스냅 촬영 버튼을 누르면 현재 화면을 사진으로 캡처해 저장한다."},{id:"p15-b10",type:"p",text:"일시 정지 버튼을 누르면 현재 영상이 멈추며, 사진을 찍고 싶으면 스냅 촬영 버튼을 누르면 된다."},{id:"p15-b11",type:"p",text:"이때, 영상 녹화 중일 경우에 화면은 정지되지만, 녹화는 계속 진행된다."},{id:"p15-b12",type:"p",text:"⚠ 주의 (WARNING): 메모리 녹화 가능 시간 경고 음"},{id:"p15-b13",type:"p",text:"녹화가능시간 1시간 이하 시 경고음 1회 출력"},{id:"p15-b14",type:"p",text:"녹화가능시간 30분 이하 시 경고음 1회 출력"},{id:"p15-b15",type:"p",text:"녹화가능시간 10분 이하 시 경고음 3회 출력"},{id:"p15-b16",type:"p",text:"⚠ 주의 (WARNING):"},{id:"p15-b17",type:"p",text:"녹화는 30분 단위로 파일을 생성한다."},{id:"p15-b18",type:"p",text:"녹화 파일 폴더의 위치는 <설정에서 지정한 폴더 위치=d:DCIM> d:/DCIM/YYYYMMDD/ 이다."},{id:"p15-b19",type:"p",text:"확장자는 mp4이며 encoding mode는 H.264이다."},{id:"p15-b20",type:"p",text:"생성되는 파일의 이름 예: YYYYMMDD_hhmmss_XX.mp4 (년월일_시간_분_초_번호.mp4)"},{id:"p15-b21",type:"p",text:"녹화 파일은 정해진 단위 30분(약 8GB)을 넘으면 다음 파일을 자동으로 생성한다."}]},{no:16,blocks:[{id:"p16-b1",type:"h",text:"6. 하이라이트 태그 삽입",cert:!1},{id:"p16-b2",type:"p",text:"동영상을 녹화하는 도중 하이라이트 태그 버튼을 누르면 특정 순간이 녹화 파일에 표시 된다."},{id:"p16-b3",type:"p",text:"(LookCAM LT 뷰어 전용)"},{id:"p16-b4",type:"p",text:"하이라이트 태그를 통해 중요한 순간을 쉽게 찾을 수 있다. (하이라이트 태그 버튼)"},{id:"p16-b5",type:"img",text:"하이라이트 버튼"},{id:"p16-b6",type:"h",text:"7. 줌인, 줌 아웃",cert:!1},{id:"p16-b7",type:"p",text:'"Zoom" : 디지털 줌인, 줌 아웃 기능이며'},{id:"p16-b8",type:"p",text:"배율은 1.0 ~ up to 8배이며, 배율단위는 OS에 따라 다르게 동작한다"},{id:"p16-b9",type:"p",text:"녹화 파일은 기본 1x 로 저장 된다."},{id:"p16-b10",type:"img",text:"줌인, 줌 아웃 버튼"}]},{no:17,blocks:[{id:"p17-b1",type:"h",text:"기본 고장수리",cert:!1},{id:"p17-b2",type:"p",text:"⚠ AS를 신청하기 전 주의사항(WARNING):"},{id:"p17-b3",type:"p",text:"기기에 저장된 중요한 데이터는 사용자가 정기적으로 백업(별도저장)해 두어야 한다. 경우에 따라 제품 안에 있는 모든 데이터들은 A/S를 위해 삭제될 수 있다."},{id:"p17-b4",type:"p",text:"A/S 신청에 앞서 중요한 데이터는 반드시 사용자가 직접 백업해야 한다."},{id:"p17-b5",type:"p",text:"㈜제노시스에 접수된 모든 A/S 제품에 대해서는 사용자가 백업을 받은 제품으로 간주하고, 별도의 백업을 실시하지 않는다. 따라서 데이터관리에 관한 모든 책임은 소비자에게 있음을 주지하시오."},{id:"p17-b6",type:"table",rows:[["증 상","문 제 해 결"],["카메라가 인식되지 않음",`USB 연결 상태 확인

사운드 드라이버 확인`],["카메라 렌즈 전면부가 흔들리거나 유격이 있다.","렌즈 전면부 캡의 풀림·유격·이탈 여부와 렌즈 고정 상태를 확인한다. 이상이 확인되면 즉시 사용을 중지하고 본사 또는 해당 대리점에 점검을 의뢰한다."]]}]},{no:18,blocks:[{id:"p18-b1",type:"h",text:"제품 규격",cert:!1},{id:"p18-b2",type:"h",text:"1. 치수 및 중량",cert:!1},{id:"p18-b3",type:"table",rows:[[`1) LooksCAM LT 카메라 조립체 (LCLT-CU)

도한 충격, 직사 광선, 고온 등의 요인에 노출을 피한다. 이 요인들은 장비 고장의 원인이 될 수 있다."},{id:"p20-b9",type:"h",text:"세척방법",cert:!1},{id:"p20-b10",type:"p",text:"LED 조명렌즈모듈 및 카메라렌즈의 표면은 오염물질을 제거하기 위해 중성세제를 적신 부드러운 천으로 본 제품의 외부를 주기적으로 닦고 건조시킨 후 사용한다."},{id:"p20-b11",type:"p",text:"벤젠, 알코올, 시너, 아세톤 등 휘발성 용매를 세척에 사용해서는 안되며 부득이 접촉이 있을 경우 중성세제를 적신 부드러운 천으로 닦아준다. 단, 이때 발생된 손상은 본사에서 책임지지 않는다."},{id:"p20-b12",type:"p",text:"과도한 열이나 습기를 포함하는 멸균공정 이나 세척공정에 본 제품이 노출되지 않도록 한다. 노출된다면 제품의 손상을 초래하며 보증 수리가 되지 않음을 유의한다. 특히 본체의 내부부품은 어떠한 액체의 접촉도 허가하지 않는다."},{id:"p20-b13",type:"h",text:"서비스와 보증",cert:!1},{id:"p20-b14",type:"p",text:"본 서비스와 보증은 특별한 서비스와 보증 규정이 없는 한 모든 국가에 적용된다"},{id:"p20-b15",type:"p",text:"본 제품의 모든 서비스와 조정은 본사로부터의 자격이 주어진 사람에 의해 실시되어야 한다."},{id:"p20-b16",type:"p",text:"당사는 본 제품에 대해 자재 및 제작상 결함 혹은 정상 사용하의 고장에 대해 판매일로부터 2년을 보증한다. 즉, 서비스와 보증 기간은 출하일로부터 2년으로로 산정한다."},{id:"p20-b17",type:"p",text:"최초 제품 수령 후 결함 발견 시, 수령일로부터 15일 이내에 당사 또는 대리점에 해당 사실을 통보해야 한다. 이 기간내에 통보하지 않으면 보증대상에서 제외된다."},{id:"p20-b18",type:"p",text:"이 보증은 오용, 남용, 경시, 부적절한 설치나 작동을 하거나 권한이 부여된 서비스 요원 이외에의 사람에 의해 개조, 조정, 혹은 일부 변경한 제품은 적용되지 않는다."},{id:"p20-b19",type:"p",text:"교체수리 후 파손된 부품이나 제품은 (주)제노시스에 소유권이 있다."}]},{no:21,blocks:[{id:"p21-b1",type:"p",text:"새로 교체된 부품으로 인해 제품의 보증기간이 연장되지 않음을 유의해야 한다."},{id:"p21-b2",type:"p",text:"고객 요청에 의한 개조 및 변형된 부품은 보증을 받지 못한다."},{id:"p21-b3",type:"p",text:"제품번호(시리얼번호)가 제시되지 않는 경우나 인지가 불가한 경우 서비스와 보증을 받을 수 없다."},{id:"p21-b4",type:"p",text:"서비스와 보증에 관한 변경사항은 사전에 (주)제노시스의 승낙이 있어야 한다."},{id:"p21-b5",type:"p",text:"본 설명서에 있는 기본고장수리 방법으로 해결되지 않는 고장이 발생했을 때 제품은 당사로 반송해야 한다. 당사는 제품을 수리해서 고객에게 반송할 것이다. 자격이 부여된 자에 의해 검사한 결과 기능고장의 원인이 오용이나 남용에 의한 것이라고 결정된다면 보증 조항은 적용되지 않을 것이다. 수리작업에 대한 비용 계산서는 장비에 대한 서비스 및 수리에 앞서 통보된다."},{id:"p21-b6",type:"p",text:"수리가 요구되는 장비를 발송하기 전에 당사나 해당 대리점에 연락한다. 당사나 해당 대리점은 반송품 권한번호를 부여할 것이며 이는 장비 추적을 용이하게 할 것이다."},{id:"p21-b7",type:"p",text:"이 제품의 부품은 소비자가 쉽게 수리 또는 교환할 수 있는 것이 아니기에 서비스가 필요한 경우 제품을 구입처에 보내 주시기 바랍니다. 요청이 있을 경우, 기술설명서와 매뉴얼을 제공할 수 있습니다."},{id:"p21-b8",type:"p",text:"부작용 보고
